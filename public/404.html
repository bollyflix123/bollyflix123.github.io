<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmyZilla | Redirecting...</title>
    
    <!-- GitHub Pages Single Page Application Redirect Handler -->
    <script type="text/javascript">
      (function() {
        var l = window.location;
        // Determine whether subpath (e.g. /filmyzilla/) or root domain (https://mvietcollege.github.io/) is being accessed
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var pathSegmentsToKeep = (pathSegments.length > 0 && pathSegments[0].toLowerCase() === 'filmyzilla') ? 1 : 0;
        
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to FilmyZilla...</p>
  </body>
</html>
